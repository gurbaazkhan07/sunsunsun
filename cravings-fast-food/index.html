<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cravings — Fast Food</title>
<meta name="description" content="Cravings fast food ordering and admin dashboard">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#ef3e2f;--red2:#ff654f;--cream:#fff8ed;--ink:#191919;--muted:#737373;--line:#eee8df;--green:#1f9d63;--shadow:0 18px 50px rgba(35,24,18,.09)}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.container{max-width:1180px;margin:auto;padding:0 22px}.topbar{height:34px;background:#191919;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}.nav{height:78px;background:rgba(255,248,237,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.navin{height:100%;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{display:flex;align-items:center;gap:10px;font-family:'Plus Jakarta Sans';font-size:21px}.logoMark{width:39px;height:39px;border-radius:12px;background:var(--red);display:grid;place-items:center;color:white;font-weight:800;transform:rotate(-7deg)}.navlinks{display:flex;gap:24px;color:#555;font-size:14px}.navlinks a{cursor:pointer}.navActions{display:flex;gap:10px;align-items:center}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 15px}.cartBtn{background:var(--red);color:white;border-radius:999px;padding:11px 16px;font-weight:700}.hero{padding:58px 0 42px}.heroGrid{display:grid;grid-template-columns:1.05fr .95fr;gap:35px;align-items:center}.eyebrow{color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.hero h1{font-family:'Plus Jakarta Sans';font-size:clamp(42px,6vw,72px);line-height:.98;margin:14px 0 20px;letter-spacing:-.05em}.hero h1 span{color:var(--red)}.hero p{font-size:17px;line-height:1.65;color:var(--muted);max-width:550px}.heroBtns{display:flex;gap:12px;margin-top:27px;flex-wrap:wrap}.primary{background:var(--red);color:#fff;padding:14px 20px;border-radius:14px;font-weight:800;box-shadow:0 12px 26px rgba(239,62,47,.22)}.secondary{background:#fff;color:var(--ink);padding:14px 20px;border-radius:14px;border:1px solid var(--line);font-weight:700}.heroImg{height:430px;border-radius:32px;background:linear-gradient(145deg,#ffb65c,#ef3e2f);overflow:hidden;box-shadow:var(--shadow);position:relative}.heroImg img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;opacity:.9}.heroBadge{position:absolute;right:20px;top:20px;background:#fff;border-radius:18px;padding:13px 15px;font-weight:800;box-shadow:0 10px 30px #0002}.section{padding:45px 0}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.sectionHead h2{font-family:'Plus Jakarta Sans';font-size:31px;margin:0}.muted{color:var(--muted)}.categories{display:flex;gap:10px;overflow:auto;padding-bottom:8px}.cat{white-space:nowrap;padding:10px 15px;border:1px solid var(--line);background:#fff;border-radius:999px}.cat.active{background:#191919;color:#fff}.menuGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 6px 20px rgba(20,10,5,.04);transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.foodImg{height:190px;overflow:hidden;background:#eee}.foodImg img{width:100%;height:100%;object-fit:cover}.cardBody{padding:16px}.tag{display:inline-block;font-size:11px;font-weight:800;color:var(--red);background:#fff0ed;border-radius:999px;padding:5px 8px;margin-bottom:8px}.card h3{margin:0 0 7px;font-size:17px}.card p{font-size:13px;color:var(--muted);line-height:1.45;min-height:38px;margin:0 0 13px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.price{font-weight:800;font-size:17px}.add{background:#191919;color:#fff;border-radius:11px;padding:9px 12px;font-weight:800}.offer{background:#191919;color:#fff;border-radius:28px;padding:32px;display:flex;align-items:center;justify-content:space-between;gap:20px}.offer h3{font-family:'Plus Jakarta Sans';font-size:29px;margin:0 0 8px}.offer p{color:#c9c9c9;margin:0}.whiteBtn{background:#fff;color:#191919;padding:12px 17px;border-radius:12px;font-weight:800}.footer{padding:40px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.drawer{position:fixed;inset:0;background:#0007;z-index:50;display:flex;justify-content:flex-end}.drawerPanel{width:min(450px,100%);height:100%;background:var(--cream);padding:25px;overflow:auto}.drawerHead{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line)}.cartItem{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.cartItem img{width:62px;height:62px;border-radius:13px;object-fit:cover}.qty{display:flex;align-items:center;gap:8px}.qty button{width:27px;height:27px;border-radius:8px;background:#fff;border:1px solid var(--line)}.checkoutBox{margin-top:20px;background:#fff;border:1px solid var(--line);padding:17px;border-radius:18px}.field{width:100%;padding:12px 13px;border:1px solid #ddd4c9;border-radius:11px;background:#fff;margin-top:7px;outline:none}.field:focus{border-color:var(--red)}.fieldLabel{font-size:12px;font-weight:800;color:#555;margin-top:12px;display:block}.admin{min-height:100vh;background:#f5f6f8}.adminShell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#191919;color:#fff;padding:22px;position:sticky;top:0;height:100vh}.side .logo{margin-bottom:40px}.sideNav button{display:block;width:100%;text-align:left;background:transparent;color:#aaa;padding:12px;border-radius:10px;margin:4px 0}.sideNav button.active,.sideNav button:hover{background:#2c2c2c;color:#fff}.adminMain{padding:28px;max-width:1400px;width:100%}.adminTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.adminTop h1{font-family:'Plus Jakarta Sans';margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:#fff;border:1px solid #e8e9eb;border-radius:18px;padding:18px}.stat small{color:#777}.stat strong{display:block;font-size:29px;margin-top:7px}.adminGrid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid #e8e9eb;border-radius:18px;padding:18px}.panel h3{margin:0 0 15px}.order{border:1px solid #eee;border-radius:14px;padding:14px;margin-bottom:10px}.orderTop{display:flex;justify-content:space-between;gap:10px}.status{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#fff4db;color:#9a6400}.status.done{background:#e9f8f0;color:#19754a}.status.cancelled{background:#ffecec;color:#a32b2b}.orderMeta{font-size:12px;color:#777;margin-top:6px}.orderItems{font-size:13px;margin:10px 0}.orderActions{display:flex;gap:7px}.smallBtn{padding:7px 9px;border-radius:9px;background:#f3f3f3;font-size:12px;font-weight:700}.smallBtn.red{background:#ffe9e5;color:#b72f24}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#191919,#3b211e);padding:20px}.loginCard{width:min(420px,100%);background:#fff;border-radius:25px;padding:30px}.loginCard h1{font-family:'Plus Jakarta Sans';margin:12px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#191919;color:#fff;padding:12px 18px;border-radius:999px;z-index:100;font-size:13px;box-shadow:var(--shadow)}.modal{position:fixed;inset:0;background:#0007;z-index:60;display:grid;place-items:center;padding:20px}.modalCard{background:var(--cream);width:min(520px,100%);border-radius:22px;padding:23px}.orderSuccess{text-align:center;padding:20px}.successIcon{font-size:55px}.tracking{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:20px}.steps{display:flex;justify-content:space-between;gap:8px;margin:18px 0}.step{text-align:center;font-size:11px;color:#999;flex:1}.dot{width:28px;height:28px;border-radius:50%;background:#eee;margin:auto auto 7px;display:grid;place-items:center;font-weight:800}.step.active{color:#191919;font-weight:800}.step.active .dot{background:var(--red);color:#fff}@media(max-width:900px){.heroGrid{grid-template-columns:1fr}.heroImg{height:320px}.menuGrid{grid-template-columns:repeat(2,1fr)}.adminShell{grid-template-columns:1fr}.side{position:relative;height:auto}.sideNav{display:flex;overflow:auto;gap:5px}.sideNav button{width:auto;white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}.adminGrid{grid-template-columns:1fr}}@media(max-width:560px){.navlinks{display:none}.menuGrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.adminMain{padding:16px}.hero{padding-top:35px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const IMG={hero:'https://images.unsplash.com/photo-1571091718767-18b5b1457add?auto=format&fit=crop&w=1200&q=85',burger:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=700&q=85',pizza:'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=700&q=85',fries:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=700&q=85',wings:'https://images.unsplash.com/photo-1527477396000-e27163b481c2?auto=format&fit=crop&w=700&q=85',shake:'https://images.unsplash.com/photo-1572490122747-3968b75cc699?auto=format&fit=crop&w=700&q=85',wrap:'https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=700&q=85',taco:'https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?auto=format&fit=crop&w=700&q=85'};
const seed=[
{id:'1',name:'Cravings Classic',cat:'Burgers',price:149,desc:'Smoky grilled patty, cheese, lettuce and house sauce.',img:IMG.burger,tag:'Bestseller'},
{id:'2',name:'Firecracker Burger',cat:'Burgers',price:179,desc:'Crispy chicken, spicy sauce, jalapeño and cheese.',img:IMG.burger,tag:'Spicy'},
{id:'3',name:'Loaded Pizza',cat:'Pizza',price:249,desc:'Cheesy crust loaded with veggies and smoky toppings.',img:IMG.pizza,tag:'Popular'},
{id:'4',name:'Crispy Fries',cat:'Sides',price:89,desc:'Golden, crunchy fries with our signature seasoning.',img:IMG.fries,tag:'Crunchy'},
{id:'5',name:'Hot Wings',cat:'Sides',price:159,desc:'Juicy wings tossed in a sweet-and-spicy glaze.',img:IMG.wings,tag:'Hot'},
{id:'6',name:'Street Wrap',cat:'Wraps',price:139,desc:'Grilled filling, fresh crunch and creamy garlic sauce.',img:IMG.wrap,tag:'Fresh'},
{id:'7',name:'Loaded Tacos',cat:'Wraps',price:169,desc:'Three soft tacos packed with seasoned filling.',img:IMG.taco,tag:'New'},
{id:'8',name:'Choco Shake',cat:'Drinks',price:119,desc:'Thick chocolate shake topped with whipped cream.',img:IMG.shake,tag:'Sweet'}];
const state={menu:JSON.parse(localStorage.getItem('cravings_menu')||'null')||seed,cart:JSON.parse(localStorage.getItem('cravings_cart')||'[]'),orders:JSON.parse(localStorage.getItem('cravings_orders')||'[]'),cat:'All',admin:false,adminTab:'orders'};
function save(){localStorage.setItem('cravings_menu',JSON.stringify(state.menu));localStorage.setItem('cravings_cart',JSON.stringify(state.cart));localStorage.setItem('cravings_orders',JSON.stringify(state.orders))}
function money(n){return '₹'+n.toLocaleString('en-IN')}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function add(id){const x=state.cart.find(i=>i.id===id);if(x)x.qty++;else state.cart.push({id,qty:1});save();render();toast('Added to your cravings 🍔')}
function change(id,d){const x=state.cart.find(i=>i.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)state.cart=state.cart.filter(i=>i.id!==id);save();render()}
function cartTotal(){return state.cart.reduce((s,i)=>{const m=state.menu.find(x=>x.id===i.id);return s+(m?m.price*i.qty:0)},0)}
function customer(){const cats=['All',...new Set(state.menu.map(x=>x.cat))];const items=state.menu.filter(x=>state.cat==='All'||x.cat===state.cat);return `<div class="topbar">🔥 Free delivery on orders above ₹399 · Cravings Fast Food</div><nav class="nav"><div class="container navin"><div class="logo"><div class="logoMark">C</div>CRAVINGS</div><div class="navlinks"><a onclick="scrollTo({top:0,behavior:'smooth'})">Home</a><a onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">Menu</a><a onclick="openTrack()">Track Order</a></div><div class="navActions"><button class="pill" onclick="adminLogin()">Admin</button><button class="cartBtn" onclick="openCart()">Cart · ${state.cart.reduce((s,x)=>s+x.qty,0)}</button></div></div></nav><main><section class="hero"><div class="container heroGrid"><div><div class="eyebrow">Fast food. Big cravings.</div><h1>Good food.<br><span>Zero waiting.</span></h1><p>Hot burgers, loaded sides and comfort food delivered wherever you are. Pick your favorites, place your order and we’ll handle the rest.</p><div class="heroBtns"><button class="primary" onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">Order now →</button><button class="secondary" onclick="openTrack()">Track my order</button></div></div><div class="heroImg"><img src="${IMG.hero}" alt="Cravings fast food"><div class="heroBadge">⚡ 25–35 min</div></div></div></section><section class="section" id="menu"><div class="container"><div class="sectionHead"><div><div class="eyebrow">Pick your poison</div><h2>The Cravings Menu</h2></div><div class="muted">${state.menu.length} items</div></div><div class="categories">${cats.map(c=>`<button class="cat ${c===state.cat?'active':''}" onclick="state.cat='${c}';render()">${c}</button>`).join('')}</div><div class="menuGrid" style="margin-top:18px">${items.map(m=>`<article class="card"><div class="foodImg"><img src="${m.img}" alt="${m.name}"></div><div class="cardBody"><span class="tag">${m.tag}</span><h3>${m.name}</h3><p>${m.desc}</p><div class="row"><span class="price">${money(m.price)}</span><button class="add" onclick="add('${m.id}')">+ Add</button></div></div></article>`).join('')}</div></div></section><section class="section"><div class="container"><div class="offer"><div><h3>Hungry for a deal?</h3><p>Use code <b>CRAVE20</b> for ₹20 off your next order above ₹299.</p></div><button class="whiteBtn" onclick="copyCode()">Copy code</button></div></div></section></main><footer class="footer"><div class="container"><b>CRAVINGS</b> · Fast food for every mood. © 2026</div></footer></div>`}
function openCart(){document.body.insertAdjacentHTML('beforeend',`<div class="drawer" id="cartDrawer" onclick="if(event.target.id==='cartDrawer')closeCart()"><div class="drawerPanel"><div class="drawerHead"><h2>Your order</h2><button class="close" onclick="closeCart()">×</button></div>${state.cart.length?state.cart.map(i=>{const m=state.menu.find(x=>x.id===i.id);return `<div class="cartItem"><img src="${m.img}"><div style="flex:1"><b>${m.name}</b><div class="muted">${money(m.price)} each</div><div class="qty"><button onclick="change('${m.id}',-1)">−</button><span>${i.qty}</span><button onclick="change('${m.id}',1)">+</button></div></div><b>${money(m.price*i.qty)}</b></div>`}).join(''):`<div style="padding:55px 10px;text-align:center"><div style="font-size:45px">🍟</div><h3>Your cart is empty</h3><p class="muted">Add something delicious from the menu.</p></div>`}<div class="checkoutBox"><div class="row"><span>Subtotal</span><b>${money(cartTotal())}</b></div><div class="row" style="margin-top:8px"><span>Delivery</span><span>${cartTotal()>=399||cartTotal()===0?'Free':money(39)}</span></div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div class="row"><b>Total</b><b>${money(cartTotal()+(cartTotal()>=399||cartTotal()===0?0:39))}</b></div>${state.cart.length?`<button class="primary" style="width:100%;margin-top:15px" onclick="checkout()">Checkout →</button>`:''}</div></div></div>`)}
function closeCart(){document.getElementById('cartDrawer')?.remove()}
function checkout(){closeCart();document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="checkoutModal"><div class="modalCard"><div class="drawerHead"><h2>Delivery details</h2><button class="close" onclick="document.getElementById('checkoutModal').remove()">×</button></div><label class="fieldLabel">Your name<input class="field" id="cname" placeholder="Rahul"></label><label class="fieldLabel">Phone number<input class="field" id="cphone" placeholder="98765 43210"></label><label class="fieldLabel">Delivery address<textarea class="field" id="caddr" rows="3" placeholder="House / building, street, area, city"></textarea></label><label class="fieldLabel">Payment<select class="field" id="cpay"><option>Cash on Delivery</option><option>UPI on delivery</option></select></label><button class="primary" style="width:100%;margin-top:16px" onclick="placeOrder()">Place order · ${money(cartTotal()+(cartTotal()>=399?0:39))}</button></div></div>`)}
function placeOrder(){const name=document.getElementById('cname').value.trim(),phone=document.getElementById('cphone').value.trim(),addr=document.getElementById('caddr').value.trim();if(!name||!phone||!addr)return toast('Please fill all delivery details');const total=cartTotal()+(cartTotal()>=399?0:39);const order={id:'CRV'+Date.now().toString().slice(-6),name,phone,address:addr,payment:document.getElementById('cpay').value,total,items:state.cart.map(i=>{const m=state.menu.find(x=>x.id===i.id);return{name:m.name,qty:i.qty,price:m.price}}),status:'New',created:new Date().toISOString()};state.orders.unshift(order);state.cart=[];save();document.getElementById('checkoutModal').remove();showOrder(order)}
function showOrder(o){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="successModal"><div class="modalCard orderSuccess"><div class="successIcon">🎉</div><h2>Order placed!</h2><p class="muted">Your order <b>${o.id}</b> has been sent to the Cravings kitchen.</p><div class="tracking"><div class="row"><b>${o.status}</b><b>${money(o.total)}</b></div><div class="steps"><div class="step active"><div class="dot">✓</div>Placed</div><div class="step"><div class="dot">2</div>Preparing</div><div class="step"><div class="dot">3</div>On the way</div><div class="step"><div class="dot">4</div>Delivered</div></div><button class="primary" style="width:100%" onclick="document.getElementById('successModal').remove()">Done</button></div></div></div>`)}
function openTrack(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="trackModal"><div class="modalCard"><div class="drawerHead"><h2>Track an order</h2><button class="close" onclick="document.getElementById('trackModal').remove()">×</button></div><input class="field" id="trackId" placeholder="Enter order ID e.g. CRV123456"><button class="primary" style="width:100%;margin-top:12px" onclick="trackOrder()">Track order</button><div id="trackResult"></div></div></div>`)}
function trackOrder(){const id=document.getElementById('trackId').value.trim().toUpperCase(),o=state.orders.find(x=>x.id===id),r=document.getElementById('trackResult');if(!o){r.innerHTML='<p class="muted" style="margin-top:15px">Order not found in this browser. Ask the customer who placed the order for the correct ID.</p>';return}const statuses=['New','Preparing','On the way','Delivered'];const idx=statuses.indexOf(o.status);r.innerHTML=`<div class="tracking"><div class="row"><b>${o.id}</b><span class="status ${o.status==='Delivered'?'done':''}">${o.status}</span></div><p class="muted">${o.items.map(i=>`${i.qty}× ${i.name}`).join(', ')}</p><div class="steps">${statuses.map((s,i)=>`<div class="step ${i<=idx?'active':''}"><div class="dot">${i<=idx?'✓':i+1}</div>${s}</div>`).join('')}</div></div>`}
function copyCode(){navigator.clipboard?.writeText('CRAVE20');toast('Code copied: CRAVE20')}
function adminLogin(){if(state.admin){renderAdmin();return}document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="loginModal"><div class="loginCard"><div class="logo"><div class="logoMark">C</div>CRAVINGS ADMIN</div><h1>Kitchen control room</h1><p class="muted">Only staff can enter this dashboard.</p><input class="field" id="apass" type="password" placeholder="Admin password"><button class="primary" style="width:100%;margin-top:14px" onclick="doLogin()">Sign in</button><p class="muted" style="font-size:11px;margin-top:12px">Demo password: <b>cravings123</b></p></div></div>`)}
function doLogin(){if(document.getElementById('apass').value!=='cravings123')return toast('Incorrect admin password');state.admin=true;document.getElementById('loginModal').remove();renderAdmin()}
function renderAdmin(){document.body.innerHTML=`<div class="admin"><div class="adminShell"><aside class="side"><div class="logo"><div class="logoMark">C</div>CRAVINGS</div><div class="sideNav"><button class="${state.adminTab==='orders'?'active':''}" onclick="state.adminTab='orders';renderAdmin()">📦 Orders</button><button class="${state.adminTab==='menu'?'active':''}" onclick="state.adminTab='menu';renderAdmin()">🍔 Menu</button><button class="${state.adminTab==='store'?'active':''}" onclick="state.adminTab='store';renderAdmin()">⚙ Store</button></div><button class="secondary" style="width:100%;margin-top:35px" onclick="state.admin=false;render()">← Customer site</button></aside><main class="adminMain">${adminContent()}</main></div></div>`}
function adminContent(){const delivered=state.orders.filter(o=>o.status==='Delivered').length,revenue=state.orders.reduce((s,o)=>s+(o.status==='Cancelled'?0:o.total),0);if(state.adminTab==='menu')return `<div class="adminTop"><div><div class="eyebrow">Kitchen control</div><h1>Menu manager</h1></div><button class="primary" onclick="addMenuItem()">+ Add item</button></div><div class="panel"><h3>Live menu</h3>${state.menu.map(m=>`<div class="order"><div class="orderTop"><div><b>${m.name}</b><div class="orderMeta">${m.cat} · ${money(m.price)} · ${m.tag}</div></div><div><button class="smallBtn" onclick="editMenu('${m.id}')">Edit</button> <button class="smallBtn red" onclick="deleteMenu('${m.id}')">Delete</button></div></div></div>`).join('')}</div>`;if(state.adminTab==='store')return `<div class="adminTop"><div><div class="eyebrow">Settings</div><h1>Store settings</h1></div></div><div class="panel"><h3>Cravings Fast Food</h3><label class="fieldLabel">Store status<select class="field"><option>Open — accepting orders</option><option>Closed</option></select></label><label class="fieldLabel">Average delivery time<input class="field" value="25–35 min"></label><label class="fieldLabel">Minimum free-delivery order<input class="field" value="399"></label><button class="primary" style="margin-top:16px" onclick="toast('Store settings saved')">Save settings</button></div>`;return `<div class="adminTop"><div><div class="eyebrow">Good evening, Admin</div><h1>Orders dashboard</h1></div><button class="secondary" onclick="renderAdmin()">↻ Refresh</button></div><div class="stats"><div class="stat"><small>Total orders</small><strong>${state.orders.length}</strong></div><div class="stat"><small>New / active</small><strong>${state.orders.filter(o=>!['Delivered','Cancelled'].includes(o.status)).length}</strong></div><div class="stat"><small>Revenue</small><strong>${money(revenue)}</strong></div><div class="stat"><small>Delivered</small><strong>${delivered}</strong></div></div><div class="adminGrid"><div class="panel"><h3>Incoming orders</h3>${state.orders.length?state.orders.map(orderCard).join(''):'<p class="muted">No orders yet. Customer orders will appear here automatically.</p>'}</div><div class="panel"><h3>Quick actions</h3><p class="muted">Orders placed on the customer side are stored and immediately appear in this dashboard on the same browser/device.</p><button class="secondary" style="width:100%;margin-bottom:9px" onclick="state.adminTab='menu';renderAdmin()">Manage menu</button><button class="secondary" style="width:100%" onclick="state.orders=[];save();renderAdmin()">Clear demo orders</button></div></div>`}
function orderCard(o){return `<div class="order"><div class="orderTop"><div><b>${o.id}</b><div class="orderMeta">${o.name} · ${o.phone} · ${new Date(o.created).toLocaleString()}</div></div><span class="status ${o.status==='Delivered'?'done':o.status==='Cancelled'?'cancelled':''}">${o.status}</span></div><div class="orderItems">${o.items.map(i=>`${i.qty}× ${i.name} (${money(i.price)})`).join('<br>')}<br><b>Total: ${money(o.total)}</b><br><span class="muted">📍 ${o.address}</span></div><div class="orderActions">${o.status==='New'?`<button class="smallBtn" onclick="setStatus('${o.id}','Preparing')">Start preparing</button>`:''}${o.status==='Preparing'?`<button class="smallBtn" onclick="setStatus('${o.id}','On the way')">Out for delivery</button>`:''}${o.status==='On the way'?`<button class="smallBtn" onclick="setStatus('${o.id}','Delivered')">Mark delivered</button>`:''}${!['Delivered','Cancelled'].includes(o.status)?`<button class="smallBtn red" onclick="setStatus('${o.id}','Cancelled')">Cancel</button>`:''}</div></div>`}
function setStatus(id,status){const o=state.orders.find(x=>x.id===id);if(o)o.status=status;save();renderAdmin();toast('Order '+id+' updated')}
function addMenuItem(){const name=prompt('Item name');if(!name)return;const price=Number(prompt('Price in ₹','149'));const cat=prompt('Category','Burgers');state.menu.push({id:'m'+Date.now(),name,cat,price:price||149,desc:'Freshly made at Cravings.',img:IMG.burger,tag:'New'});save();renderAdmin()}
function editMenu(id){const m=state.menu.find(x=>x.id===id);if(!m)return;const n=prompt('Item name',m.name);if(n)m.name=n;const p=prompt('Price',m.price);if(p)m.price=Number(p);save();renderAdmin()}
function deleteMenu(id){if(!confirm('Delete this menu item?'))return;state.menu=state.menu.filter(x=>x.id!==id);save();renderAdmin()}
function render(){document.body.innerHTML=customer()}
render();
</script></body></html>
